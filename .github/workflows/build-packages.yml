name: Build - Packages (CI/CD)

on:
  workflow_dispatch: # Triggered by Dispatch (CI/CD)
    inputs:
      stable:
        description: 'Stable release build'
        required: true
        type: string
        default: 'OFF'

concurrency:
  group: packages-${{ github.repository }}
  cancel-in-progress: false # queue the syncs, never cancel a publication

env:
  # Content of the packages (the XMOUSE_PACKAGE_BIN / XMOUSE_PACKAGE_LIB / XMOUSE_PACKAGE_DEV options of the CMakeLists.txt)
  NAME: "xmouse"
  PACKAGE_BIN: "ON"
  PACKAGE_LIB: "OFF"
  PACKAGE_DEV: "OFF"

jobs:
  # The android app (touchpad, screen lent to the network): embedded in every binary (each device serves it), attached to the release
  build-apk:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number of the app is the number of commits (a new apk of the same version is an update)

      - name: Set up the Java compiler
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Signing key of the app (the same for every release, else the phones refuse the updates)
        env:
          KEYSTORE: ${{ secrets.XMOUSE_ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::warning title=No signing key::secret XMOUSE_ANDROID_KEYSTORE missing: a key of this run signs the app (its updates will not install over it)"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks

      - name: Build the android app (aapt2, javac, d8, apksigner)
        env:
          XMOUSE_KEYSTORE_PASS: ${{ secrets.XMOUSE_ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          [ -n "${XMOUSE_KEYSTORE_PASS:-}" ] || unset XMOUSE_KEYSTORE_PASS
          scripts/build_apk.sh
          test -f android/build/xmouse.apk
          echo "✓ android/build/xmouse.apk $(cat android/build/version.txt) ($(du -h android/build/xmouse.apk | cut -f1))"

      - name: Upload the android app
        uses: actions/upload-artifact@v6
        with:
          name: android-app
          path: |
            android/build/xmouse.apk
            android/build/version.txt
          retention-days: 1

  build-packages:
    needs: build-apk
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check the version of the tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # A tag vX.Y.Z / vX.Y.Z-<suffix> publishes the packages of project(... VERSION X.Y.Z): both must match
          VERSION="$(sed -nE 's/^project\(.*VERSION ([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt | head -1)"
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error title=Version mismatch,file=CMakeLists.txt::tag $GITHUB_REF_NAME but project(... VERSION $VERSION) in the CMakeLists.txt: update the version, then move the tag"
            exit 1
          fi
          echo "✓ tag $GITHUB_REF_NAME = project version $VERSION"

      - name: Install the xmouse dependencies (Qt 6, OpenSSL, XTest)
        run: dnf install -y qt6-qtbase-devel openssl-devel libXtst-devel

      - name: Get the android app (embedded in the binary)
        uses: actions/download-artifact@v5
        with:
          name: android-app
          path: android/build

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp', 'cmake/config/exceptions/*.json', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build packages (Release)
        run: |
          set -e
          cmake -S . -B build -DXMOUSE_STABLE_RELEASE=${{ inputs.stable }} -DPACKAGE_RELEASE=${{ github.run_number }}
          cmake --build build --target package_release --parallel $(nproc)
        timeout-minutes: 6

      - name: Show ccache stats
        run: ccache -s

      - name: Check packages
        run: |
          set -euo pipefail
          # Expected files: <base>-<variant>-<version>-Linux-<component>.<ext>, <dev>-<version>-Linux-headers[-<variant>].<ext>, <base>-<version>-Linux.<ext>
          # (<version> = X.Y.Z or pre-X.Y.Z), the file base is the executable name, else the library one
          NAME="${NAME,,}" # package names: lower case, '-' instead of '_' (like the CMakeLists.txt)
          NAME="${NAME//_/-}"
          LIB="lib${NAME#lib}"
          if [ "$PACKAGE_BIN" = "ON" ]; then BASE="$NAME"; else BASE="$LIB"; fi
          if [ "$PACKAGE_LIB" = "ON" ]; then DEV="$LIB-dev"; else DEV="$BASE-dev"; fi

          check() { # <package> <file pattern>
            for ext in rpm deb; do
              pattern="${2//@ext@/$ext}"
              FILE=$(find ./build -maxdepth 1 -name "$pattern" -print -quit)
              if [ -z "$FILE" ]; then
                echo "::error title=Missing package (${ext^^})::Package '$1' (.$ext) not found (pattern: $pattern)"
                exit 1
              fi
              echo "✓ Package '$1' (.$ext) ok -> $(basename "$FILE")"
            done
          }

          for variant in op db as; do
            [ "$PACKAGE_BIN" = "ON" ] && check "$NAME-$variant" "$BASE-$variant-*-Linux-bin.@ext@"
            [ "$PACKAGE_LIB" = "ON" ] && check "$LIB-$variant" "$BASE-$variant-*-Linux-lib.@ext@"
            [ "$PACKAGE_DEV" = "ON" ] && [ "$PACKAGE_LIB" = "ON" ] && check "$DEV-$variant" "$DEV-*-Linux-headers-$variant.@ext@"
          done
          [ "$PACKAGE_DEV" = "ON" ] && check "$DEV" "$DEV-*-Linux-headers.@ext@"
          check "$BASE" "$BASE-*-Linux.@ext@"

      - name: Check packages (Arch)
        run: |
          set -euo pipefail
          # Expected files: <package>-<pkgver>-<pkgrel>-<arch>.pkg.tar.zst, one per package (named like the RPM / DEB packages)
          NAME="${NAME,,}" # package names: lower case, '-' instead of '_' (like the CMakeLists.txt)
          NAME="${NAME//_/-}"
          LIB="lib${NAME#lib}"
          if [ "$PACKAGE_BIN" = "ON" ]; then BASE="$NAME"; else BASE="$LIB"; fi
          if [ "$PACKAGE_LIB" = "ON" ]; then DEV="$LIB-dev"; else DEV="$BASE-dev"; fi

          check() { # <package> <arch>
            pattern="$1(-pre)?-[0-9.]+-[0-9]+-$2\.pkg\.tar\.zst"
            FILE=$(find ./build -maxdepth 1 -regextype posix-extended -regex ".*/$pattern" -print -quit)
            if [ -z "$FILE" ]; then
              echo "::error title=Missing package (ARCH)::Package '$1' (.pkg.tar.zst) not found (pattern: $pattern)"
              exit 1
            fi
            echo "✓ Package '$1' (.pkg.tar.zst) ok -> $(basename "$FILE")"
          }

          for variant in op db as; do
            [ "$PACKAGE_BIN" = "ON" ] && check "$NAME-$variant" x86_64
            [ "$PACKAGE_LIB" = "ON" ] && check "$LIB-$variant" x86_64
            [ "$PACKAGE_DEV" = "ON" ] && [ "$PACKAGE_LIB" = "ON" ] && check "$DEV-$variant" any
          done
          [ "$PACKAGE_DEV" = "ON" ] && check "$DEV" any
          check "$BASE" any

      - name: Bundle the Linux tarball (bin/xmouse, menu entry, icon, GNOME extension)
        run: |
          set -euo pipefail
          scripts/bundle_linux.sh --no-build
          test -f dist/xmouse-linux-x86_64.tar.gz
          echo "✓ dist/xmouse-linux-x86_64.tar.gz ($(du -h dist/xmouse-linux-x86_64.tar.gz | cut -f1))"

      - name: Upload compiled packages
        uses: actions/upload-artifact@v6
        with:
          name: compiled-packages
          path: |
            build/*.rpm
            build/*.deb
            build/*.pkg.tar.zst
          retention-days: 1

      # Apart from the packages (one artifact = one root folder: the repository sync expects the packages at its root)
      - name: Upload the tarball and the android app (attached to the release)
        uses: actions/upload-artifact@v6
        with:
          name: compiled-packages-linux-files
          path: |
            dist/xmouse-linux-x86_64.tar.gz
            android/build/xmouse.apk
          retention-days: 1

  build-packages-windows:
    needs: build-apk
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/mingw64-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install the xmouse dependencies (Qt 6, OpenSSL)
        run: dnf install -y mingw64-qt6-qtbase mingw64-openssl

      - name: Get the android app (embedded in the binary)
        uses: actions/download-artifact@v5
        with:
          name: android-app
          path: android/build

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-mingw64-${{ hashFiles('**/*.cpp', '**/*.hpp', 'cmake/config/exceptions/*.json', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-mingw64-

      - name: Build packages (Release, MinGW-w64)
        run: |
          set -e
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/mingw-w64.cmake -DXMOUSE_STABLE_RELEASE=${{ inputs.stable }} -DPACKAGE_RELEASE=${{ github.run_number }}
          cmake --build build --target package_release --parallel $(nproc)
        timeout-minutes: 8

      - name: Show ccache stats
        run: ccache -s

      - name: Check packages
        run: |
          set -euo pipefail
          # Same files as the Linux ones with the mingw64- prefix and the win64 system, without the Asan variant
          NAME="${NAME,,}" # package names: lower case, '-' instead of '_' (like the CMakeLists.txt)
          NAME="${NAME//_/-}"
          LIB="mingw64-lib${NAME#lib}"
          if [ "$PACKAGE_BIN" = "ON" ]; then BASE="mingw64-$NAME"; else BASE="$LIB"; fi
          if [ "$PACKAGE_LIB" = "ON" ]; then DEV="$LIB-dev"; else DEV="$BASE-dev"; fi

          check() { # <package> <file pattern>
            for ext in rpm deb; do
              pattern="${2//@ext@/$ext}"
              FILE=$(find ./build -maxdepth 1 -name "$pattern" -print -quit)
              if [ -z "$FILE" ]; then
                echo "::error title=Missing package (${ext^^})::Package '$1' (.$ext) not found (pattern: $pattern)"
                exit 1
              fi
              echo "✓ Package '$1' (.$ext) ok -> $(basename "$FILE")"
            done
          }

          for variant in op db; do
            [ "$PACKAGE_BIN" = "ON" ] && check "mingw64-$NAME-$variant" "$BASE-$variant-*-win64-bin.@ext@"
            [ "$PACKAGE_LIB" = "ON" ] && check "$LIB-$variant" "$BASE-$variant-*-win64-lib.@ext@"
            [ "$PACKAGE_DEV" = "ON" ] && [ "$PACKAGE_LIB" = "ON" ] && check "$DEV-$variant" "$DEV-*-win64-headers-$variant.@ext@"
          done
          [ "$PACKAGE_DEV" = "ON" ] && check "$DEV" "$DEV-*-win64-headers.@ext@"
          check "$BASE" "$BASE-*-win64.@ext@"

      - name: Bundle the Windows zip and installer (xmouse.exe + its dll, install.ps1, setup)
        run: |
          set -euo pipefail
          command -v zip > /dev/null || dnf install -y zip
          command -v makensis > /dev/null || dnf install -y mingw32-nsis
          scripts/bundle_windows.sh --no-build --installer
          test -f dist/xmouse-windows-x64.zip
          test -f dist/xmouse-windows-x64-setup.exe
          echo "✓ dist/xmouse-windows-x64.zip ($(du -h dist/xmouse-windows-x64.zip | cut -f1)), dist/xmouse-windows-x64-setup.exe ($(du -h dist/xmouse-windows-x64-setup.exe | cut -f1))"

      - name: Upload compiled packages
        uses: actions/upload-artifact@v6
        with:
          name: compiled-packages-windows
          path: |
            build/*.rpm
            build/*.deb
          retention-days: 1

      - name: Upload the zip and the installer (attached to the release)
        uses: actions/upload-artifact@v6
        with:
          name: compiled-packages-windows-files
          path: |
            dist/xmouse-windows-x64.zip
            dist/xmouse-windows-x64-setup.exe
          retention-days: 1

  # >>> gh-pages >>> (removed by setup.sh without the gh-pages option: the packages stay as artifacts of the run)
  sync-online-packages:
    needs: [build-packages, build-packages-windows]
    if: needs.build-packages.result == 'success' && needs.build-packages-windows.result == 'success'
    permissions:
      contents: write

    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/package:latest

    steps:
      - name: Download compiled packages
        uses: actions/download-artifact@v7
        with:
          pattern: compiled-packages*
          merge-multiple: true
          path: build

      - name: Download the android app
        uses: actions/download-artifact@v7
        with:
          name: android-app
          path: app

      - name: Checkout xmouse - gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Sync the android app into gh-pages (its updates without any device)
        run: |
          set -euo pipefail
          test -f app/xmouse.apk && test -f app/version.txt
          mkdir -p gh-pages/app
          cp app/xmouse.apk gh-pages/app/xmouse.apk
          VERSION="$(tr -d '[:space:]' < app/version.txt)"
          SHA="$(sha256sum app/xmouse.apk | cut -d' ' -f1)"
          SIZE="$(stat -c %s app/xmouse.apk)"
          printf '{\n    "version": "%s",\n    "sha256": "%s",\n    "size": %s,\n    "apk": "xmouse.apk"\n}\n' "$VERSION" "$SHA" "$SIZE" > gh-pages/app/version.json
          cat gh-pages/app/version.json

      - name: Import GPG key
        run: |
          set -e
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      - name: Sign packages (RPM)
        run: |
          set -e
          # Import public key into RPM before verification
          gpg --armor --export "${{ secrets.GPG_KEY_ID }}" > /tmp/pubkey.asc
          rpm --import /tmp/pubkey.asc

          # Configure RPM to use the GPG key and non-interactive signing.
          cat > ~/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name ${{ secrets.GPG_KEY_ID }}
          %__gpg $(command -v gpg)
          %_gpg_sign_cmd_extra_args --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}"
          EOF

          # Sign RPM packages
          rpm --addsign build/*.rpm

          # Check of the signature
          for f in build/*.rpm; do
            echo "Checking signature: $f"
            rpm -Kv "$f"
          done

      - name: Sync files into gh-pages (RPM)
        run: |
          set -euo pipefail
          REPO_DIR="gh-pages/fedora/44/x86_64"
          mkdir -p "$REPO_DIR" # Security
          mv build/*.rpm $REPO_DIR/

          # Keep every release, only the 5 last versions of each pre-release package
          prune_pre() {
              local dir="$1" ext="$2" keep=5
              find "$dir" -maxdepth 1 -name "*-pre-[0-9]*.${ext}" -printf '%f\n' \
                  | sed -E 's/^(.+-pre)-([0-9]+\.[0-9]+\.[0-9]+)-(.+)$/\1 \2 \3/' \
                  | sort -k1,1 -k3,3 -k2,2V \
                  | awk -v keep="$keep" '{key = $1 " " $3; n[key]++; f[key, n[key]] = $1 "-" $2 "-" $3} END {for (k in n) for (i = 1; i <= n[k] - keep; i++) print f[k, i]}' \
                  | while read -r file; do echo "Prune old pre-release: $file"; rm -f "$dir/$file"; done
          }
          prune_pre "$REPO_DIR" rpm

      - name: Update metadata and signature (RPM)
        working-directory: gh-pages/fedora/44/x86_64
        run: |
          set -e
          createrepo_c --update .
          rm -f repodata/repomd.xml.asc
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor repodata/repomd.xml

      - name: Sync files into gh-pages (DEB)
        run: |
          set -euo pipefail
          POOL_DIR="gh-pages/debian/pool/main"
          mkdir -p "$POOL_DIR"
          mv build/*.deb "$POOL_DIR/"

          # Keep every release, only the 5 last versions of each pre-release package
          prune_pre() {
              local dir="$1" ext="$2" keep=5
              find "$dir" -maxdepth 1 -name "*-pre-[0-9]*.${ext}" -printf '%f\n' \
                  | sed -E 's/^(.+-pre)-([0-9]+\.[0-9]+\.[0-9]+)-(.+)$/\1 \2 \3/' \
                  | sort -k1,1 -k3,3 -k2,2V \
                  | awk -v keep="$keep" '{key = $1 " " $3; n[key]++; f[key, n[key]] = $1 "-" $2 "-" $3} END {for (k in n) for (i = 1; i <= n[k] - keep; i++) print f[k, i]}' \
                  | while read -r file; do echo "Prune old pre-release: $file"; rm -f "$dir/$file"; done
          }
          prune_pre "$POOL_DIR" deb

      - name: Update metadata and signature (DEB)
        working-directory: gh-pages/debian
        run: |
          set -euo pipefail
          DIST_DIR="dists/stable/main/binary-amd64"
          mkdir -p "$DIST_DIR"

          # Generate Packages index
          dpkg-scanpackages --multiversion pool/main /dev/null > "$DIST_DIR/Packages"
          gzip -k -f "$DIST_DIR/Packages"
          xz -k -f "$DIST_DIR/Packages"

          # Generate Release file
          cat > dists/stable/Release <<EOF
          Origin: TsukiNi22
          Label: xmouse
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: xmouse APT repository
          Date: $(date -Ru)
          EOF

          apt-ftparchive release dists/stable >> dists/stable/Release

          # Sign the Release file
          rm -f dists/stable/Release.gpg dists/stable/InRelease
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Sync files into gh-pages (Arch)
        run: |
          set -euo pipefail
          REPO_DIR="gh-pages/arch/x86_64"
          mkdir -p "$REPO_DIR"

          # Sign the packages (detached binary signatures, read by repo-add and pacman)
          for f in build/*.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --default-key "${{ secrets.GPG_KEY_ID }}" --detach-sign --no-armor -o "$f.sig" "$f"
          done
          mv build/*.pkg.tar.zst build/*.pkg.tar.zst.sig "$REPO_DIR/"

          # Keep every release, only the 5 last versions of each pre-release package (<name>-pre-<pkgver>-<pkgrel>-<arch>)
          find "$REPO_DIR" -maxdepth 1 -name "*-pre-[0-9]*.pkg.tar.zst" -printf '%f\n' \
              | sed -E 's/^(.+-pre)-([0-9.]+-[0-9]+)-([a-z0-9_]+)\.pkg\.tar\.zst$/\1 \2 \3/' \
              | sort -k1,1 -k2,2V \
              | awk -v keep=5 '{n[$1]++; f[$1, n[$1]] = $1 "-" $2 "-" $3 ".pkg.tar.zst"} END {for (k in n) for (i = 1; i <= n[k] - keep; i++) print f[k, i]}' \
              | while read -r file; do echo "Prune old pre-release: $file"; rm -f "${REPO_DIR:?}/${file:?}" "${REPO_DIR:?}/${file:?}.sig"; done

      - name: Update metadata and signature (Arch)
        working-directory: gh-pages/arch/x86_64
        run: |
          set -euo pipefail
          # Database rebuilt from every package, oldest first (the last version of a package wins)
          rm -f xmouse.db* xmouse.files*
          find . -maxdepth 1 -name "*.pkg.tar.zst" -printf '%f\n' | sort -V | xargs repo-add -q --include-sigs xmouse.db.tar.gz

          # GitHub Pages: real files instead of the symbolic links of repo-add, signed databases
          for db in xmouse.db xmouse.files; do
            cp --remove-destination "$db.tar.gz" "$db"
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --default-key "${{ secrets.GPG_KEY_ID }}" --detach-sign --no-armor -o "$db.sig" "$db"
            cp "$db.sig" "$db.tar.gz.sig"
          done

      - name: Commit and push
        working-directory: gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync packages from main (${{ github.sha }})"
          # gh-pages can move meanwhile (docs, packages or manual push): rebase on it and retry
          for attempt in 1 2 3 4 5; do
            if git push origin gh-pages; then
              exit 0
            fi
            echo "Push refused: rebase on the new gh-pages and retry ($attempt/5)..."
            git pull --rebase origin gh-pages
          done
          echo "::error title=Push::gh-pages not pushed after 5 attempts"
          exit 1
  # <<< gh-pages <<<
